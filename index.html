<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Site</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
    }

    /* Header — initial height and animation defined here */
    #header {
      height: 60px;
      overflow: hidden;
      transition: height 0.4s ease;
    }

    /* Section container styles — heights and overflow defined here */
    #s1 { height: 100vh; overflow: hidden; }
    #s2 { height: 100vh; overflow: hidden; }
    #s3 { height: 100vh; overflow: hidden; }
    #s4 { height: 100vh; overflow: hidden; }
    #s5 { height: 100vh; overflow: hidden; }
  </style>
</head>
<body>

  <div id="header"></div>

  <div id="s1"></div>
  <div id="s2"></div>
  <div id="s3"></div>
  <div id="s4"></div>
  <div id="s5"></div>

  <script>
    async function loadHeader() {
      const res = await fetch('header.html');
      const html = await res.text();
      document.getElementById('header').innerHTML = html;

      // small delay so transition kicks in after style is registered
      setTimeout(() => {
        const finalHeight = document.getElementById('header').dataset.height;
        document.getElementById('header').style.height = finalHeight;
      }, 50);
    }

    async function loadSection(id, file) {
      const res = await fetch(file);
      const html = await res.text();
      document.getElementById(id).innerHTML = html;
    }

    loadHeader();
    loadSection('s1', 'sections/s1.html');
    loadSection('s2', 'sections/s2.html');
    loadSection('s3', 'sections/s3.html');
    loadSection('s4', 'sections/s4.html');
    loadSection('s5', 'sections/s5.html');
  </script>

</body>
</html>
